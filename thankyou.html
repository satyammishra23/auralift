        <img src="images/auralift.png" alt="Auralift logo" class="w-10 h-10">
        <span class="text-2xl font-bold text-brand">Auralift</span>
      </a>
      <nav class="hidden md:flex gap-6 items-center text-gray-700 font-medium">

        <a href="about.html" class="hover:text-brand">About</a>
        <a href="contact.html" class="hover:text-brand">Contact</a>

        We've received your message and our team will get back to you shortly.
        Stay strong, stay fit with <span class="font-semibold text-brand">Auralift</span> 💪

      <a href="index.html"

  <!-- Footer -->

      <div class="space-x-4">
